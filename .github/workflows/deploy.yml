name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Build static site
        run: npm run build

      - name: 📄 Ensure .htaccess is in build output
        run: |
          if [ -f "public/.htaccess" ]; then
            cp public/.htaccess out/.htaccess
          fi

      - name: 🧹 Clean FTP Server Hostname
        id: parse_server
        run: |
          RAW="${{ secrets.FTP_SERVER }}"
          CLEAN=$(echo "$RAW" | sed -e 's|^[a-zA-Z]*://||' -e 's|/.*$||' | tr -d '[:space:]')
          echo "CLEAN_SERVER=$CLEAN" >> "$GITHUB_ENV"

      - name: 🚀 Deploy via LFTP to Hostinger
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set ftp:ssl-allow true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ env.CLEAN_SERVER }}';
            mirror --reverse --delete --verbose --parallel=5 ./out/ ./public_html/
          "
