name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Build static site
        run: npm run build

      - name: 📄 Ensure .htaccess is in build output
        run: |
          if [ -f "public/.htaccess" ]; then
            cp public/.htaccess out/.htaccess
          fi

      - name: 🧹 Clean FTP Server Hostname
        id: parse_server
        run: |
          RAW="${{ secrets.FTP_SERVER }}"
          CLEAN=$(echo "$RAW" | sed -e 's|^[a-zA-Z]*://||' -e 's|/.*$||' | tr -d '[:space:]')
          echo "CLEAN_SERVER=$CLEAN" >> "$GITHUB_ENV"

      - name: 🚀 Deploy via LFTP to Hostinger
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ env.CLEAN_SERVER }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          
          echo "Checking directory and uploading files..."
          lftp -e "
            set ftp:ssl-allow true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 3;
            set cmd:fail-exit true;
            user \"$FTP_USER\" \"$FTP_PASS\";
            pwd;
            ls;
            mirror --reverse --delete --verbose ./out/ ./public_html/;
            bye;
          " "$FTP_HOST" || lftp -e "
            set ftp:ssl-allow true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 3;
            set cmd:fail-exit true;
            user \"$FTP_USER\" \"$FTP_PASS\";
            mirror --reverse --delete --verbose ./out/ ./;
            bye;
          " "$FTP_HOST"
