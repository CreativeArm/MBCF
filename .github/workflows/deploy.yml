name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Build static site
        run: npm run build

      - name: 📄 Ensure .htaccess is in build output
        run: |
          if [ -f "public/.htaccess" ]; then
            cp public/.htaccess out/.htaccess
          fi

      - name: 🧹 Clean FTP Server Hostname
        id: parse_server
        run: |
          RAW="${{ secrets.FTP_SERVER }}"
          CLEAN=$(echo "$RAW" | sed -e 's|^[a-zA-Z]*://||' -e 's|/.*$||' | tr -d '[:space:]')
          echo "CLEAN_SERVER=$CLEAN" >> "$GITHUB_ENV"

      - name: 🚀 Deploy via FTP to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.CLEAN_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          port: 21
          timeout: 60000
          local-dir: ./out/
          server-dir: ./public_html/
